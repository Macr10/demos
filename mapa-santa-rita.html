*{box-sizing:border-box}
body{
  margin:0;
  background:var(--papel);
  color:var(--tinta);
  font-family:'Poppins',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior:none;
}
#app{
  position:relative;
  width:100%;
  height:100dvh;
  min-height:520px;
  overflow:hidden;
  background:linear-gradient(180deg,var(--cielo-alto),var(--cielo-bajo));
}
#lienzo{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  display:block;
  touch-action:none;
  cursor:grab;
}
#lienzo.arrastrando{cursor:grabbing}

/* ── Barra superior ─────────────────────────────────────────── */
.barra{
  position:absolute;
  top:0;left:0;right:0;
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:12px;
  padding:14px 14px 0;
  pointer-events:none;
}
.marca{
  pointer-events:auto;
  background:var(--panel);
  border:1px solid var(--panel-borde);
  border-radius:16px;
  padding:9px 15px 10px;
  box-shadow:var(--sombra-ui);
}
.marca-eyebrow{
  display:block;
  font-size:9px;
  font-weight:600;
  letter-spacing:.16em;
  text-transform:uppercase;
  color:var(--tinta-suave);
  line-height:1;
}
.marca-nombre{
  margin:3px 0 0;
  font-family:'Rotulo','Poppins',sans-serif;
  font-size:23px;
  line-height:.95;
  letter-spacing:.005em;
  color:var(--magenta);
  text-wrap:balance;
}
.acciones{display:flex;gap:8px;pointer-events:auto}
.btn-icono{
  width:42px;height:42px;
  display:grid;place-items:center;
  background:var(--panel);
  border:1px solid var(--panel-borde);
  border-radius:13px;
  color:var(--tinta);
  box-shadow:var(--sombra-ui);
  cursor:pointer;
  padding:0;
  transition:transform .15s ease,background .15s ease;
}
.btn-icono:hover{background:var(--panel-alto)}
.btn-icono:active{transform:scale(.93)}
.btn-icono svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
:is(.btn-icono,.chip,.item,.hoja-agarre,.cerrar):focus-visible{
  outline:2px solid var(--magenta);
  outline-offset:2px;
}

/* ── Chips de filtro ────────────────────────────────────────── */
.filtros{
  position:absolute;
  top:74px;left:0;right:0;
  display:flex;
  gap:7px;
  padding:0 14px 6px;
  overflow-x:auto;
  scrollbar-width:none;
  -webkit-overflow-scrolling:touch;
}
.filtros::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;
  display:inline-flex;
  align-items:center;
  gap:6px;
  font-family:inherit;
  font-size:12px;
  font-weight:600;
  color:var(--tinta);
  background:var(--panel);
  border:1px solid var(--panel-borde);
  border-radius:999px;
  padding:8px 13px;
  cursor:pointer;
  white-space:nowrap;
  box-shadow:var(--sombra-ui);
  transition:background .15s ease,color .15s ease,border-color .15s ease;
}
.chip .punto{width:8px;height:8px;border-radius:50%;background:var(--tono,var(--magenta))}
.chip[aria-pressed="true"]{
  background:var(--magenta);
  border-color:var(--magenta);
  color:#fff;
}
.chip[aria-pressed="true"] .punto{background:#fff}

/* ── Controles de zoom ──────────────────────────────────────── */
.zoom{
  position:absolute;
  right:14px;
  bottom:calc(var(--alto-hoja,150px) + 16px);
  display:flex;
  flex-direction:column;
  gap:8px;
  transition:bottom .32s cubic-bezier(.32,.72,0,1);
}

/* ── Hoja inferior ──────────────────────────────────────────── */
.hoja{
  position:absolute;
  left:0;right:0;bottom:0;
  max-height:76%;
  display:flex;
  flex-direction:column;
  background:var(--panel);
  border-top:1px solid var(--panel-borde);
  border-radius:22px 22px 0 0;
  box-shadow:0 -8px 34px var(--sombra-suelo);
  transform:translateY(calc(100% - var(--alto-hoja,150px)));
  transition:transform .32s cubic-bezier(.32,.72,0,1);
}
.hoja.abierta{transform:translateY(0)}
.hoja-agarre{
  flex:0 0 auto;
  display:block;
  width:100%;
  background:none;
  border:0;
  padding:11px 0 5px;
  cursor:pointer;
}
.hoja-agarre::before{
  content:"";
  display:block;
  width:40px;height:4px;
  margin:0 auto;
  border-radius:99px;
  background:var(--panel-borde);
}
.hoja-cuerpo{
  flex:1 1 auto;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  padding:0 16px 22px;
}

/* Detalle de un punto */
.detalle-cabecera{
  display:flex;
  align-items:flex-start;
  gap:12px;
}
.detalle-sello{
  flex:0 0 auto;
  width:46px;height:46px;
  border-radius:14px;
  display:grid;place-items:center;
  background:var(--tono,var(--magenta));
  color:#fff;
}
.detalle-sello svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.detalle-textos{flex:1 1 auto;min-width:0}
.detalle-cat{
  font-size:10px;
  font-weight:700;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:var(--tono,var(--magenta));
}
.detalle-nombre{
  margin:2px 0 0;
  font-size:21px;
  font-weight:700;
  line-height:1.15;
  text-wrap:balance;
}
.cerrar{
  flex:0 0 auto;
  width:32px;height:32px;
  display:grid;place-items:center;
  border-radius:10px;
  border:1px solid var(--panel-borde);
  background:var(--panel-alto);
  color:var(--tinta-suave);
  cursor:pointer;
  padding:0;
}
.cerrar svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round}
.detalle-desc{
  margin:13px 0 0;
  font-size:14px;
  line-height:1.6;
  color:var(--tinta-suave);
  max-width:62ch;
}
.datos{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  margin-top:14px;
}
.dato{
  font-size:11.5px;
  font-weight:600;
  color:var(--tinta-suave);
  background:var(--panel-alto);
  border:1px solid var(--panel-borde);
  border-radius:9px;
  padding:6px 10px;
}

/* Directorio */
.grupo-titulo{
  font-family:'Rotulo','Poppins',sans-serif;
  font-size:12px;
  letter-spacing:.12em;
  text-transform:uppercase;
  color:var(--tinta-suave);
  margin:20px 0 8px;
  display:flex;
  align-items:center;
  gap:9px;
}
.grupo-titulo::after{
  content:"";
  flex:1 1 auto;
  height:1px;
  background:var(--panel-borde);
}
.lista{
  list-style:none;
  margin:0;padding:0;
  display:grid;
  gap:5px;
}
.item{
  width:100%;
  display:flex;
  align-items:center;
  gap:11px;
  text-align:left;
  font-family:inherit;
  font-size:14px;
  font-weight:500;
  color:var(--tinta);
  background:var(--panel-alto);
  border:1px solid transparent;
  border-radius:12px;
  padding:10px 12px;
  cursor:pointer;
  transition:border-color .15s ease,background .15s ease;
}
.item:hover{border-color:var(--panel-borde)}
.item[aria-current="true"]{
  border-color:var(--tono,var(--magenta));
  background:var(--panel);
}
.item-punto{
  flex:0 0 auto;
  width:26px;height:26px;
  border-radius:8px;
  display:grid;place-items:center;
  background:var(--tono,var(--magenta));
  color:#fff;
}
.item-punto svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
.pista{
  margin:4px 0 0;
  font-size:12.5px;
  color:var(--tinta-suave);
  line-height:1.5;
}
.pista b{color:var(--tinta);font-weight:600}

/* ── Escritorio: la hoja pasa a ser panel lateral ───────────── */
@media (min-width:820px){
  .hoja{
    top:14px;
    left:14px;
    right:auto;
    bottom:14px;
    width:352px;
    max-height:none;
    border-radius:20px;
    border:1px solid var(--panel-borde);
    transform:none;
    box-shadow:var(--sombra-ui);
  }
  .hoja-agarre{display:none}
  .hoja-cuerpo{padding:18px 18px 22px}
  .barra{left:380px;padding-top:16px}
  .filtros{left:380px;top:78px}
  .zoom{bottom:20px}
}

@media (prefers-reduced-motion:reduce){
  .hoja,.zoom,.btn-icono,.chip,.item{transition:none}
}

/* ═══════════════════════════════════════════════════════════════
   2 · MOTOR ISOMÉTRICO
   ═══════════════════════════════════════════════════════════════ */

const MUNDO = { ancho:120, alto:84 };
const lienzo = document.getElementById("lienzo");
let ctx = lienzo.getContext("2d");   // se desvía a un sprite al pre-dibujar
const menosMovimiento = matchMedia("(prefers-reduced-motion:reduce)");

/* Proyección: mundo (x,y,z) → plano isométrico */
const PX = 0.5, PY = 0.29, PZ = 0.86;
function proy(x, y, z){
  return [ (x - y) * PX, (x + y) * PY - z * PZ ];
}

let paleta = {};
function leerPaleta(){
  const cs = getComputedStyle(document.documentElement);
  const t = n => cs.getPropertyValue("--" + n).trim();
  paleta = {
    agua:t("agua"), aguaHondo:t("agua-hondo"), aguaClara:t("agua-clara"),
    lago:t("lago"), lagoHondo:t("lago-hondo"),
    selva:t("selva"), selvaHondo:t("selva-hondo"), selvaClara:t("selva-clara"),
    cesped:t("cesped"), cespedAlt:t("cesped-alt"),
    arena:t("arena"), arenaHondo:t("arena-hondo"),
    asfalto:t("asfalto"), asfaltoHondo:t("asfalto-hondo"),
    teja:t("teja"), tejaHondo:t("teja-hondo"),
    muro:t("muro"), muroHondo:t("muro-hondo"),
    magenta:t("magenta"), sol:t("sol"),
    sombra:t("sombra-suelo"),
    tinta:t("tinta"),
    panel:t("panel")
  };
  paleta.noche = esOscuro();
}
function esOscuro(){
  const marca = document.documentElement.getAttribute("data-theme");
  if (marca === "dark") return true;
  if (marca === "light") return false;
  return matchMedia("(prefers-color-scheme:dark)").matches;
}

/* Aclara u oscurece un color hex una cantidad dada (-1 a 1) */
function tinte(hex, cant){
  const c = hex.replace("#","");
  const n = c.length === 3
    ? c.split("").map(ch => parseInt(ch+ch,16))
    : [parseInt(c.slice(0,2),16), parseInt(c.slice(2,4),16), parseInt(c.slice(4,6),16)];
  const m = n.map(v => {
    const r = cant >= 0 ? v + (255 - v) * cant : v * (1 + cant);
    return Math.max(0, Math.min(255, Math.round(r)));
  });
  return "rgb(" + m.join(",") + ")";
}

/* Ruido determinista: mismo resultado en cada carga */
let semilla = 20250811;
function azar(){
  semilla = (semilla * 1664525 + 1013904223) % 4294967296;
  return semilla / 4294967296;
}
function entre(a, b){ return a + azar() * (b - a); }

/* Polígono orgánico para albercas y lagos */
function blob(cx, cy, rx, ry, lados, rugosidad){
  const p = [];
  for (let i = 0; i < lados; i++){
    const a = (i / lados) * Math.PI * 2;
    const f = 1 + Math.sin(a * 3 + cx) * rugosidad + Math.cos(a * 2 + cy) * rugosidad * 0.6;
    p.push([cx + Math.cos(a) * rx * f, cy + Math.sin(a) * ry * f]);
  }
  return p;
}
function rect(x, y, an, al){
  return [[x,y],[x+an,y],[x+an,y+al],[x,y+al]];
}

/* ── Primitivas de dibujo ───────────────────────────────────── */

function subPoly(pts, z){
  for (let i = 0; i < pts.length; i++){
    const [sx, sy] = proy(pts[i][0], pts[i][1], z || 0);
    if (i === 0) ctx.moveTo(sx, sy); else ctx.lineTo(sx, sy);
  }
  ctx.closePath();
}
function trazarPoly(pts, z){
  ctx.beginPath();
  subPoly(pts, z);
}
function cajaPoly(pts){
  let minx = Infinity, maxx = -Infinity, miny = Infinity, maxy = -Infinity;
  for (const [px, py] of pts){
    const [sx, sy] = proy(px, py, 0);
    if (sx < minx) minx = sx;
    if (sx > maxx) maxx = sx;
    if (sy < miny) miny = sy;
    if (sy > maxy) maxy = sy;
  }
  return { minx, maxx, miny, maxy };
}

function suelo(pts, color, borde){
  trazarPoly(pts, 0);
  ctx.fillStyle = color;
  ctx.fill();
  if (borde){
    ctx.strokeStyle = borde;
    ctx.lineWidth = 0.28;
    ctx.stroke();
  }
}

/* Caja extruida: cara superior + dos laterales */
function caja(x, y, an, pr, alt, color, opts){
  opts = opts || {};
  const base = opts.base != null ? opts.base : 0;
  const arriba = base + alt;
  const cTop  = tinte(color, paleta.noche ? 0.10 : 0.16);
  const cIzq  = tinte(color, -0.26);
  const cDer  = tinte(color, -0.08);

  // cara izquierda (frente-oeste)
  ctx.beginPath();
  let p = proy(x, y + pr, arriba);        ctx.moveTo(p[0], p[1]);
  p = proy(x + an, y + pr, arriba);       ctx.lineTo(p[0], p[1]);
  p = proy(x + an, y + pr, base);         ctx.lineTo(p[0], p[1]);
  p = proy(x, y + pr, base);              ctx.lineTo(p[0], p[1]);
  ctx.closePath();
  ctx.fillStyle = cDer;
  ctx.fill();

  // cara derecha (frente-este)
  ctx.beginPath();
  p = proy(x + an, y, arriba);            ctx.moveTo(p[0], p[1]);
  p = proy(x + an, y + pr, arriba);       ctx.lineTo(p[0], p[1]);
  p = proy(x + an, y + pr, base);         ctx.lineTo(p[0], p[1]);
  p = proy(x + an, y, base);              ctx.lineTo(p[0], p[1]);
  ctx.closePath();
  ctx.fillStyle = cIzq;
  ctx.fill();

  // techo plano
  trazarPoly(rect(x, y, an, pr), arriba);
  ctx.fillStyle = cTop;
  ctx.fill();
}

/* Techo a cuatro aguas sobre una caja */
function techo(x, y, an, pr, base, subida, color){
  const cima = base + subida;
  const cx = x + an / 2, cy = y + pr / 2;
  const caras = [
    { pts:[[x,y+pr],[x+an,y+pr]], luz:-0.05 },   // sur
    { pts:[[x+an,y],[x+an,y+pr]], luz:-0.24 },   // este
    { pts:[[x,y],[x+an,y]],       luz: 0.10 },   // norte
    { pts:[[x,y],[x,y+pr]],       luz: 0.02 }    // oeste
  ];
  for (const cara of caras){
    ctx.beginPath();
    let p = proy(cara.pts[0][0], cara.pts[0][1], base); ctx.moveTo(p[0], p[1]);
    p = proy(cara.pts[1][0], cara.pts[1][1], base);     ctx.lineTo(p[0], p[1]);
    p = proy(cx, cy, cima);                             ctx.lineTo(p[0], p[1]);
    ctx.closePath();
    ctx.fillStyle = tinte(color, cara.luz);
    ctx.fill();
  }
}

/* Sombra elíptica en el suelo */
function sombra(x, y, r){
  const [sx, sy] = proy(x, y, 0);
  ctx.beginPath();
  ctx.ellipse(sx, sy, r * PX * 1.5, r * PY * 1.5, 0, 0, Math.PI * 2);
  ctx.fillStyle = paleta.sombra;
  ctx.fill();
}

function arbol(x, y, esc, tono){
  sombra(x, y, esc * 0.8);
  const troncoAlt = 1.5 * esc;
  caja(x - 0.16, y - 0.16, 0.32, 0.32, troncoAlt, "#6B4A2B");
  const capas = [
    { r:1.35 * esc, z:troncoAlt,             l: 0.00 },
    { r:1.05 * esc, z:troncoAlt + 0.9 * esc, l: 0.13 },
    { r:0.68 * esc, z:troncoAlt + 1.7 * esc, l: 0.26 }
  ];
  for (const capa of capas){
    const [sx, sy] = proy(x, y, capa.z);
    ctx.beginPath();
    ctx.ellipse(sx, sy, capa.r * PX * 2.1, capa.r * PY * 2.4, 0, 0, Math.PI * 2);
    ctx.fillStyle = tinte(tono, capa.l);
    ctx.fill();
  }
}

function palmera(x, y, esc){
  sombra(x, y, esc * 0.7);
  const alt = 3.4 * esc;
  ctx.lineWidth = 0.34 * esc;
  ctx.strokeStyle = "#8A6134";
  ctx.lineCap = "round";
  ctx.beginPath();
  let p = proy(x, y, 0); ctx.moveTo(p[0], p[1]);
  p = proy(x + 0.3 * esc, y, alt); ctx.lineTo(p[0], p[1]);
  ctx.stroke();
  const copa = proy(x + 0.3 * esc, y, alt);
  for (let i = 0; i < 7; i++){
    const a = (i / 7) * Math.PI * 2;
    ctx.beginPath();
    ctx.moveTo(copa[0], copa[1]);
    ctx.quadraticCurveTo(
      copa[0] + Math.cos(a) * 1.1 * esc, copa[1] + Math.sin(a) * 0.55 * esc - 0.5 * esc,
      copa[0] + Math.cos(a) * 2.0 * esc, copa[1] + Math.sin(a) * 1.0 * esc + 0.35 * esc
    );
    ctx.lineWidth = 0.30 * esc;
    ctx.strokeStyle = tinte(paleta.selvaClara, i % 2 ? 0.08 : -0.12);
    ctx.stroke();
  }
}

function palapa(x, y, esc){
  esc = esc || 1;
  sombra(x, y, 1.4 * esc);
  const alt = 2.6 * esc;
  ctx.lineWidth = 0.3 * esc;
  ctx.strokeStyle = "#8A6134";
  ctx.beginPath();
  let p = proy(x, y, 0); ctx.moveTo(p[0], p[1]);
  p = proy(x, y, alt);   ctx.lineTo(p[0], p[1]);
  ctx.stroke();
  const r = 1.7 * esc;
  const cima = proy(x, y, alt + 1.1 * esc);
  const lados = 8;
  for (let i = 0; i < lados; i++){
    const a1 = (i / lados) * Math.PI * 2, a2 = ((i + 1) / lados) * Math.PI * 2;
    const q1 = proy(x + Math.cos(a1) * r, y + Math.sin(a1) * r, alt);
    const q2 = proy(x + Math.cos(a2) * r, y + Math.sin(a2) * r, alt);
    ctx.beginPath();
    ctx.moveTo(cima[0], cima[1]);
    ctx.lineTo(q1[0], q1[1]);
    ctx.lineTo(q2[0], q2[1]);
    ctx.closePath();
    ctx.fillStyle = tinte("#C9A063", i % 2 ? 0.06 : -0.14);
    ctx.fill();
  }
}

function camastro(x, y, giro){
  const an = giro ? 1.7 : 0.75, pr = giro ? 0.75 : 1.7;
  caja(x, y, an, pr, 0.30, paleta.noche ? "#D9E6EA" : "#FFFFFF");
}

function sombrilla(x, y){
  sombra(x, y, 1.0);
  ctx.lineWidth = 0.2;
  ctx.strokeStyle = "#9AA6AA";
  ctx.beginPath();
  let p = proy(x, y, 0); ctx.moveTo(p[0], p[1]);
  p = proy(x, y, 2.4);   ctx.lineTo(p[0], p[1]);
  ctx.stroke();
  const cima = proy(x, y, 3.1), r = 1.25;
  for (let i = 0; i < 8; i++){
    const a1 = (i / 8) * Math.PI * 2, a2 = ((i + 1) / 8) * Math.PI * 2;
    const q1 = proy(x + Math.cos(a1) * r, y + Math.sin(a1) * r, 2.4);
    const q2 = proy(x + Math.cos(a2) * r, y + Math.sin(a2) * r, 2.4);
    ctx.beginPath();
    ctx.moveTo(cima[0], cima[1]);
    ctx.lineTo(q1[0], q1[1]);
    ctx.lineTo(q2[0], q2[1]);
    ctx.closePath();
    ctx.fillStyle = i % 2 ? paleta.magenta : (paleta.noche ? "#E8F3F6" : "#FFFFFF");
    ctx.fill();
  }
}

function tienda(x, y, tono){
  sombra(x, y, 1.4);
  const an = 2.6, pr = 2.4, alt = 1.9;
  const cimaA = proy(x + an / 2, y, alt);
  const cimaB = proy(x + an / 2, y + pr, alt);
  const a = proy(x, y, 0), b = proy(x + an, y, 0);
  const c = proy(x + an, y + pr, 0), d = proy(x, y + pr, 0);
  // faldón frontal
  ctx.beginPath();
  ctx.moveTo(d[0], d[1]); ctx.lineTo(cimaB[0], cimaB[1]); ctx.lineTo(cimaA[0], cimaA[1]); ctx.lineTo(a[0], a[1]);
  ctx.closePath();
  ctx.fillStyle = tinte(tono, 0.10); ctx.fill();
  // faldón lateral
  ctx.beginPath();
  ctx.moveTo(c[0], c[1]); ctx.lineTo(cimaB[0], cimaB[1]); ctx.lineTo(cimaA[0], cimaA[1]); ctx.lineTo(b[0], b[1]);
  ctx.closePath();
  ctx.fillStyle = tinte(tono, -0.22); ctx.fill();
}

function coche(x, y, tono){
  sombra(x, y + 1, 1.2);
  caja(x, y, 1.5, 3.0, 0.85, tono);
  caja(x + 0.18, y + 0.7, 1.15, 1.5, 0.62, tinte(tono, 0.22), { base:0.85 });
}

/* Ventanas encendidas de noche */
function ventanas(x, y, an, pr, alt, filas){
  if (!paleta.noche) return;
  ctx.fillStyle = paleta.sol;
  ctx.globalAlpha = 0.85;
  for (let i = 0; i < filas; i++){
    const fx = x + 0.45 + i * 1.35;
    if (fx > x + an - 0.6) break;
    ctx.beginPath();
    let p = proy(fx, y + pr, alt * 0.68);          ctx.moveTo(p[0], p[1]);
    p = proy(fx + 0.55, y + pr, alt * 0.68);       ctx.lineTo(p[0], p[1]);
    p = proy(fx + 0.55, y + pr, alt * 0.30);       ctx.lineTo(p[0], p[1]);
    p = proy(fx, y + pr, alt * 0.30);              ctx.lineTo(p[0], p[1]);
    ctx.closePath();
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

/* Tobogán: cinta 3D que baja de un punto a otro */
function tobogan(desde, hasta, ancho, tono, curva){
  const pasos = 26;
  const cx = (desde[0] + hasta[0]) / 2 + (curva || 0);
  const cy = (desde[1] + hasta[1]) / 2 - (curva || 0) * 0.5;
  const cz = desde[2] * 0.52;
  const pts = [];
  for (let i = 0; i <= pasos; i++){
    const t = i / pasos, u = 1 - t;
    pts.push([
      u*u*desde[0] + 2*u*t*cx + t*t*hasta[0],
      u*u*desde[1] + 2*u*t*cy + t*t*hasta[1],
      u*u*desde[2] + 2*u*t*cz + t*t*hasta[2]
    ]);
  }
  /* Se pinta en tres capas: un contorno oscuro que separa un carril
     del de al lado, el faldón que le da grosor, y encima el canal. */
  function cinta(an, color, caida){
    for (let i = 0; i < pasos; i++){
      const a = pts[i], b = pts[i+1];
      const dx = b[0]-a[0], dy = b[1]-a[1];
      const len = Math.hypot(dx, dy) || 1;
      const nx = -dy / len * an / 2, ny = dx / len * an / 2;
      ctx.beginPath();
      let p = proy(a[0]+nx, a[1]+ny, a[2]);            ctx.moveTo(p[0], p[1]);
      p = proy(b[0]+nx, b[1]+ny, b[2]);                ctx.lineTo(p[0], p[1]);
      p = proy(b[0]-nx, b[1]-ny, b[2] - caida);        ctx.lineTo(p[0], p[1]);
      p = proy(a[0]-nx, a[1]-ny, a[2] - caida);        ctx.lineTo(p[0], p[1]);
      ctx.closePath();
      ctx.fillStyle = typeof color === "function" ? color(i) : color;
      ctx.fill();
    }
  }
  cinta(ancho * 1.34, tinte(tono, -0.55), 0.75);
  cinta(ancho,        tinte(tono, -0.30), 0.55);
  cinta(ancho * 0.86, i => tinte(tono, i % 2 ? 0.16 : 0.02), 0);
}

/* El agua va en dos capas: el fondo, que no cambia y viaja en la
   caché del mundo, y el oleaje, que se repinta en cada cuadro. */
function aguaBase(pts, colorBase, colorHondo, colorBrillo){
  const b = cajaPoly(pts);
  trazarPoly(pts, 0);
  const g = ctx.createLinearGradient(0, b.miny, 0, b.maxy);
  g.addColorStop(0, colorHondo);
  g.addColorStop(1, colorBase);
  ctx.fillStyle = g;
  ctx.fill();
  ctx.strokeStyle = paleta.noche ? tinte(colorBrillo, -0.35) : "#FFFFFF";
  ctx.lineWidth = 0.42;
  ctx.globalAlpha = paleta.noche ? 0.35 : 0.75;
  ctx.stroke();
  ctx.globalAlpha = 1;
}

/* `hueco` es una isla: se recorta con regla par-impar para que el
   oleaje no pase por encima de la tierra. */
function aguaBrillo(pts, hueco, colorBrillo, t){
  const b = cajaPoly(pts);
  ctx.save();
  ctx.beginPath();
  subPoly(pts, 0);
  if (hueco) subPoly(hueco, 0);
  ctx.clip("evenodd");

  ctx.globalAlpha = paleta.noche ? 0.26 : 0.40;
  ctx.strokeStyle = colorBrillo;
  ctx.lineWidth = 0.30;
  for (let sy = b.miny; sy < b.maxy; sy += 1.5){
    ctx.beginPath();
    for (let sx = b.minx; sx <= b.maxx; sx += 0.9){
      const oy = sy + Math.sin((sx * 0.55) + t * 1.6 + sy * 0.9) * 0.22;
      if (sx === b.minx) ctx.moveTo(sx, oy); else ctx.lineTo(sx, oy);
    }
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
  ctx.restore();
}

/* ── Sprites ────────────────────────────────────────────────────
   Un árbol son siete rellenos. Multiplicado por casi doscientos
   árboles, repetido sesenta veces por segundo, es lo que hacía que
   el mapa fuera a tirones en el móvil. Cada especie se dibuja una
   sola vez en un lienzo aparte y después se estampa. Se rehacen
   cuando cambia el tema, porque cambian los colores.
   ─────────────────────────────────────────────────────────────── */

const SPRITE_F = 48;   // píxeles por unidad de mundo: nítido hasta el zoom máximo

function haceSprite(an, al, anclaX, anclaY, pintar){
  const c = document.createElement("canvas");
  c.width  = Math.ceil(an * SPRITE_F);
  c.height = Math.ceil(al * SPRITE_F);
  const antes = ctx;
  ctx = c.getContext("2d");
  ctx.setTransform(SPRITE_F, 0, 0, SPRITE_F, anclaX * SPRITE_F, anclaY * SPRITE_F);
  ctx.lineJoin = "round";
  pintar();
  ctx = antes;
  return { img:c, an, al, ox:anclaX, oy:anclaY };
}

function pintaSprite(sp, x, y, esc){
  esc = esc || 1;
  const [sx, sy] = proy(x, y, 0);
  ctx.drawImage(sp.img, sx - sp.ox * esc, sy - sp.oy * esc, sp.an * esc, sp.al * esc);
}

let SPRITES = {};
function haceSprites(){
  SPRITES = {
    arbolClaro: haceSprite(3.8, 5.0, 1.9, 4.4, () => arbol(0, 0, 1, paleta.selva)),
    arbolHondo: haceSprite(3.8, 5.0, 1.9, 4.4, () => arbol(0, 0, 1, paleta.selvaHondo)),
    palmera:    haceSprite(6.0, 5.6, 3.0, 4.8, () => palmera(0, 0, 1)),
    palapa:     haceSprite(4.0, 5.2, 2.0, 4.6, () => palapa(0, 0, 1))
  };
}

function agregar(x, y, dibujar, z){

/* Zócalo de tierra: el parque se lee como una maqueta, no como
   un rectángulo flotando en el aire. */
function dibujarZocalo(){
  const H = 3.2;
  const tierra = paleta.noche ? "#3B2C1D" : "#9A7546";
  const caras = [
    { a:[0, MUNDO.alto], b:[MUNDO.ancho, MUNDO.alto], luz:-0.04 },
    { a:[MUNDO.ancho, 0], b:[MUNDO.ancho, MUNDO.alto], luz:-0.26 }
  ];
  for (const c of caras){
    ctx.beginPath();
    let p = proy(c.a[0], c.a[1], 0);   ctx.moveTo(p[0], p[1]);
    p = proy(c.b[0], c.b[1], 0);       ctx.lineTo(p[0], p[1]);
    p = proy(c.b[0], c.b[1], -H);      ctx.lineTo(p[0], p[1]);
    p = proy(c.a[0], c.a[1], -H);      ctx.lineTo(p[0], p[1]);
    ctx.closePath();
    ctx.fillStyle = tinte(tierra, c.luz);
    ctx.fill();
  }
  // veta de roca al pie del zócalo
  for (const c of caras){
    ctx.beginPath();
    let p = proy(c.a[0], c.a[1], -H * 0.62); ctx.moveTo(p[0], p[1]);
    p = proy(c.b[0], c.b[1], -H * 0.62);     ctx.lineTo(p[0], p[1]);
    p = proy(c.b[0], c.b[1], -H);            ctx.lineTo(p[0], p[1]);
    p = proy(c.a[0], c.a[1], -H);            ctx.lineTo(p[0], p[1]);
    ctx.closePath();
    ctx.fillStyle = tinte(tierra, c.luz - 0.22);
    ctx.fill();
  }
}

/* ── Suelo: superficies planas, se dibujan antes que los objetos ── */
function dibujarSuelo(t){
  dibujarZocalo();
  // césped base con dos tonos en franjas suaves
  suelo(rect(0, 0, MUNDO.ancho, MUNDO.alto), paleta.cesped);
  ctx.globalAlpha = 0.35;
  for (let fy = 0; fy < MUNDO.alto; fy += 9){
    suelo(rect(0, fy, MUNDO.ancho, 4.5), paleta.cespedAlt);
  }
  ctx.globalAlpha = 1;

  // caminos de arena
  const caminos = [
    rect(16, 44, 92, 5),     // espina este-oeste
    rect(50, 49, 10, 28),    // espina norte-sur hacia la entrada
    rect(52, 12, 6, 32),     // ramal al norte
    rect(100, 20, 6, 30),    // ramal a las villas
    rect(20, 60, 62, 4),     // frente de los edificios
    rect(4, 63, 20, 6)       // del estacionamiento a la taquilla
  ];
  for (const c of caminos) suelo(c, paleta.arena);

  // decks de las albercas
  const decks = [
    blob(57, 32, 19.5, 12.5, 22, 0.045),
    blob(44, 51, 13.5, 7.4, 18, 0.05),
    blob(88, 48, 11.5, 6.6, 16, 0.04),
    blob(27, 18, 10.5, 6.8, 16, 0.05)
  ];
  for (const d of decks) suelo(d, paleta.arena, tinte(paleta.arena, -0.16));

  // estacionamiento
  suelo(rect(4, 65.5, 44, 14.5), paleta.asfalto);
  ctx.strokeStyle = paleta.noche ? "#5E7078" : "#FFFFFF";
  ctx.lineWidth = 0.16;
  ctx.globalAlpha = 0.7;
  for (let f = 0; f < 3; f++){
    for (let c = 0; c <= 8; c++){
      ctx.beginPath();
      let p = proy(6 + c * 4.8, 67.5 + f * 4.2, 0); ctx.moveTo(p[0], p[1]);
      p = proy(6 + c * 4.8, 70.9 + f * 4.2, 0);     ctx.lineTo(p[0], p[1]);
      ctx.stroke();
    }
  }
  ctx.globalAlpha = 1;

  // carretera del borde sur
  suelo(rect(0, 80.6, MUNDO.ancho, 2.6), paleta.asfaltoHondo);

  // canchas
  suelo(rect(84, 58, 24, 14), tinte(paleta.cesped, -0.10), "#FFFFFF");
  ctx.strokeStyle = paleta.noche ? "#9FB3B9" : "#FFFFFF";
  ctx.lineWidth = 0.22;
  ctx.globalAlpha = 0.9;
  trazarPoly(rect(85, 59, 22, 12), 0); ctx.stroke();
  ctx.beginPath();
  let p = proy(96, 59, 0); ctx.moveTo(p[0], p[1]);
  p = proy(96, 71, 0);     ctx.lineTo(p[0], p[1]);
  ctx.stroke();
  const centro = proy(96, 65, 0);
  ctx.beginPath();
  ctx.ellipse(centro[0], centro[1], 2 * PX * 2, 2 * PY * 2.2, 0, 0, Math.PI * 2);
  ctx.stroke();
  ctx.globalAlpha = 1;

  suelo(rect(110, 58, 8, 8), "#C87F52", "#FFFFFF");
  suelo(rect(110, 68, 8, 8), tinte(paleta.arena, -0.05), "#FFFFFF");

  // fondo de las albercas
  for (const [clave, base, hondo, brillo] of CUERPOS_AGUA){
    aguaBase(ALBERCAS[clave], paleta[base], paleta[hondo], brillo ? paleta[brillo] : "#FFFFFF");
  }
}

/* Oleaje: única capa del mundo que se repinta cuadro a cuadro */
function dibujarOleaje(t){
  for (const [clave, , , brillo, isla, ritmo] of CUERPOS_AGUA){
    aguaBrillo(ALBERCAS[clave], isla, brillo ? paleta[brillo] : "#FFFFFF", t * ritmo);
  }
}

/* De noche cae un velo azul sobre todo el parque y después se
   encienden las luces por encima: farolas, albercas y la entrada. */
function caerLaNoche(){
  ctx.fillStyle = "rgba(5,22,34,.52)";
  ctx.fillRect(LIM.minx - 80, LIM.miny - 80, LIM.an + 160, LIM.al + 160);

  ctx.globalCompositeOperation = "lighter";
  for (const [x, y, z, radio, rgb, fuerza] of luces){
    const [sx, sy] = proy(x, y, z);
    const g = ctx.createRadialGradient(sx, sy, 0, sx, sy, radio);
    g.addColorStop(0,   "rgba(" + rgb + "," + fuerza.toFixed(3) + ")");
    g.addColorStop(0.45,"rgba(" + rgb + "," + (fuerza * 0.32).toFixed(3) + ")");
    g.addColorStop(1,   "rgba(" + rgb + ",0)");
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.ellipse(sx, sy, radio, radio * 0.62, 0, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalCompositeOperation = "source-over";
}

function limitesMundo(){
  let minx = Infinity, maxx = -Infinity, miny = Infinity, maxy = -Infinity;
  const esquinas = [[0,0],[MUNDO.ancho,0],[MUNDO.ancho,MUNDO.alto],[0,MUNDO.alto]];
  for (const [x, y] of esquinas){
    const [sx, sy] = proy(x, y, 0);
    minx = Math.min(minx, sx); maxx = Math.max(maxx, sx);
    miny = Math.min(miny, sy); maxy = Math.max(maxy, sy);
  }
  return { minx, maxx, miny: miny - 18, maxy, an: maxx - minx, al: (maxy - (miny - 18)) };
}
const LIM = limitesMundo();

function encajar(){
  const margen = anchoCSS >= 820 ? 400 : 28;
  const escX = (anchoCSS - margen - 28) / LIM.an;
  const escY = (altoCSS - 190) / LIM.al;
  return Math.max(0.5, Math.min(escX, escY));
}

function vistaCompleta(animado){
  const e = encajar();
  const cx = (LIM.minx + LIM.maxx) / 2;
  const cy = (LIM.miny + LIM.maxy) / 2;
  const destino = {
    esc: e,
    x: centroPantallaX() - cx * e,
    y: centroPantallaY() - cy * e
  };
  if (animado === false){ Object.assign(cam, destino); } else { volar(destino); }
}

/* Al abrir, el parque llena la pantalla en lugar de verse de lejos;
   el botón de la esquina devuelve la vista completa. */
function vistaInicial(){
  const e = encajar() * (anchoCSS >= 820 ? 1.45 : 1.75);
  const [sx, sy] = proy(56, 38, 0);
  cam.esc = e;
  cam.x = centroPantallaX() - sx * e;
  cam.y = centroPantallaY() - sy * e;
}

function centroPantallaX(){ return anchoCSS >= 820 ? (380 + anchoCSS) / 2 : anchoCSS / 2; }
function centroPantallaY(){ return anchoCSS >= 820 ? altoCSS / 2 : (altoCSS - altoHoja()) / 2 + 40; }

function irA(x, y, escDeseada){
  const [sx, sy] = proy(x, y, 0);
  const e = Math.max(cam.escMin, Math.min(cam.escMax, escDeseada || Math.max(cam.esc, encajar() * 2.4)));
  volar({ esc:e, x: centroPantallaX() - sx * e, y: centroPantallaY() - sy * e });
}

let vuelo = null;
function volar(destino){
  if (menosMovimiento.matches){ Object.assign(cam, destino); pedirCuadro(); return; }
  vuelo = { desde:{ x:cam.x, y:cam.y, esc:cam.esc }, hasta:destino, t0:performance.now(), dur:620 };
  pedirCuadro();
}
function avanzarVuelo(ahora){
  if (!vuelo) return;
  const p = Math.min(1, (ahora - vuelo.t0) / vuelo.dur);
  const e = p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
  cam.x   = vuelo.desde.x   + (vuelo.hasta.x   - vuelo.desde.x)   * e;
  cam.y   = vuelo.desde.y   + (vuelo.hasta.y   - vuelo.desde.y)   * e;
  cam.esc = vuelo.desde.esc + (vuelo.hasta.esc - vuelo.desde.esc) * e;
  if (p >= 1) vuelo = null;
}

function zoomEn(factor, cxp, cyp){
  const nueva = Math.max(cam.escMin, Math.min(cam.escMax, cam.esc * factor));
  const k = nueva / cam.esc;
  cam.x = cxp - (cxp - cam.x) * k;
  cam.y = cyp - (cyp - cam.y) * k;
  cam.esc = nueva;
  vuelo = null;
  pedirCuadro();
}

/* ═══════════════════════════════════════════════════════════════
   5 · MARCADORES
   ═══════════════════════════════════════════════════════════════ */

const GLIFOS = {
  ola(c, s){
    c.beginPath();
    for (let f = 0; f < 3; f++){
      const y = (-0.30 + f * 0.30) * s;
      c.moveTo(-0.45 * s, y);
      c.bezierCurveTo(-0.22 * s, y - 0.20 * s, -0.02 * s, y + 0.20 * s, 0.20 * s, y);
      c.bezierCurveTo(0.32 * s, y - 0.12 * s, 0.40 * s, y - 0.10 * s, 0.45 * s, y - 0.14 * s);
    }
    c.stroke();
  },
  tobogan(c, s){
    // torre, rampa que baja y salpicadura al final
    c.beginPath();
    c.moveTo(-0.40 * s, -0.46 * s);
    c.lineTo(-0.40 * s,  0.22 * s);
    c.stroke();
    c.beginPath();
    c.moveTo(-0.54 * s, -0.46 * s);
    c.lineTo(-0.26 * s, -0.46 * s);
    c.stroke();
    c.beginPath();
    c.moveTo(-0.40 * s, -0.30 * s);
    c.bezierCurveTo(0.06 * s, -0.26 * s, -0.04 * s, 0.20 * s, 0.36 * s, 0.26 * s);
    c.stroke();
    c.beginPath();
    c.moveTo(-0.50 * s, 0.42 * s);
    c.bezierCurveTo(-0.26 * s, 0.28 * s, -0.06 * s, 0.54 * s, 0.16 * s, 0.42 * s);
    c.bezierCurveTo(0.30 * s, 0.34 * s, 0.40 * s, 0.46 * s, 0.52 * s, 0.42 * s);
    c.stroke();
  },
  comida(c, s){
    c.beginPath();
    c.moveTo(-0.26 * s, -0.44 * s); c.lineTo(-0.26 * s, 0.44 * s);
    c.moveTo(-0.44 * s, -0.44 * s); c.lineTo(-0.44 * s, -0.06 * s);
    c.lineTo(-0.08 * s, -0.06 * s); c.lineTo(-0.08 * s, -0.44 * s);
    c.stroke();
    c.beginPath();
    c.moveTo(0.30 * s, 0.44 * s); c.lineTo(0.30 * s, -0.06 * s);
    c.bezierCurveTo(0.02 * s, -0.10 * s, 0.10 * s, -0.46 * s, 0.34 * s, -0.44 * s);
    c.bezierCurveTo(0.56 * s, -0.42 * s, 0.56 * s, -0.10 * s, 0.30 * s, -0.06 * s);
    c.stroke();
  },
  info(c, s){
    c.beginPath(); c.arc(0, -0.34 * s, 0.075 * s, 0, Math.PI * 2); c.stroke();
    c.beginPath();
    c.moveTo(-0.10 * s, -0.06 * s); c.lineTo(0.02 * s, -0.06 * s);
    c.lineTo(0.02 * s, 0.40 * s);
    c.moveTo(-0.14 * s, 0.40 * s); c.lineTo(0.18 * s, 0.40 * s);
    c.stroke();
  },
  balon(c, s){
    c.beginPath(); c.arc(0, 0, 0.44 * s, 0, Math.PI * 2); c.stroke();
    c.beginPath();
    c.moveTo(-0.44 * s, 0); c.bezierCurveTo(-0.14 * s, -0.22 * s, 0.14 * s, -0.22 * s, 0.44 * s, 0);
    c.moveTo(0, -0.44 * s); c.bezierCurveTo(-0.20 * s, -0.14 * s, -0.20 * s, 0.14 * s, 0, 0.44 * s);
    c.stroke();
  },
  casa(c, s){
    c.beginPath();
    c.moveTo(-0.46 * s, -0.02 * s); c.lineTo(0, -0.44 * s); c.lineTo(0.46 * s, -0.02 * s);
    c.stroke();
    c.beginPath();
    c.moveTo(-0.32 * s, -0.02 * s); c.lineTo(-0.32 * s, 0.42 * s); c.lineTo(0.32 * s, 0.42 * s);
    c.lineTo(0.32 * s, -0.02 * s);
    c.stroke();
  }
};

let seleccion = null;
let filtro = "todo";
const pantalla = new Map();   // id → {x,y,r,mas} en píxeles CSS, para detectar toques

/* Puntos con peso propio: si dos pines chocan, gana el mayor */
const MAYORES = new Set([
  "toboganes","eco","juegos","tropical","techada","vip","chapoteadero","lago",
  "entrada","estacionamiento","kiosco","palapas","asadores","terraza",
  "villas","acampar","vivero","futbol","basquet","voleibol","camastros"
]);

function visible(p){ return filtro === "todo" || p.cat === filtro; }

/* El reparto sólo cambia si se mueve la cámara, el filtro o la
   selección; entre medias se reutiliza el del cuadro anterior. */
let repartoCache = null, repartoClave = "";

function dibujarMarcadores(t){
  const clave = [
    cam.x.toFixed(1), cam.y.toFixed(1), cam.esc.toFixed(3), filtro, seleccion
  ].join("|");
  if (clave !== repartoClave){
    repartoClave = clave;
    repartoCache = repartirMarcadores();
  }
  const { apagados, colocados } = repartoCache;

  pantalla.clear();
  for (const m of apagados) dibujarMarcador(m, t, 0.14, false, 0);
  for (const m of colocados){
    const act = seleccion === m.p.id;
    dibujarMarcador(m, t, 1, act, m.mas.length);
    pantalla.set(m.p.id, { x: m.sx, y: m.sy, r: act ? 30 : 24, mas: m.mas.length });
  }
}

function repartirMarcadores(){
  const todos = PUNTOS.map(p => {
    const [wx, wy] = proy(p.x, p.y, p.z || 0);
    return {
      p,
      sx: wx * cam.esc + cam.x,
      sy: wy * cam.esc + cam.y,
      prof: p.x + p.y,
      mayor: MAYORES.has(p.id)
    };
  });

  // Los que el filtro deja fuera se quedan en segundo plano y no estorban
  const apagados = todos.filter(m => !visible(m.p) && seleccion !== m.p.id);
  const activos  = todos.filter(m => visible(m.p) || seleccion === m.p.id);

  /* Reparto por cercanía en pantalla: el seleccionado primero, luego
     los puntos mayores, y al final los menores. Lo que no cabe se
     resume en un contador sobre el pin que sí cupo. */
  const orden = activos.slice().sort((a, b) => {
    const pa = (seleccion === a.p.id ? 0 : a.mayor ? 1 : 2);
    const pb = (seleccion === b.p.id ? 0 : b.mayor ? 1 : 2);
    return pa - pb || a.prof - b.prof;
  });

  const separacion = 38;
  const colocados = [];
  for (const m of orden){
    let choque = null;
    for (const c of colocados){
      if (Math.hypot(c.sx - m.sx, c.sy - m.sy) < separacion){ choque = c; break; }
    }
    if (choque){ choque.mas.push(m.p.id); continue; }
    colocados.push({ ...m, mas: [] });
  }
  colocados.sort((a, b) => a.prof - b.prof);
  return { apagados, colocados };
}

function dibujarMarcador(m, t, alfa, activo, mas){
  const tono = CATEGORIAS[m.p.cat].tono;
  const glifo = GLIFOS[CATEGORIAS[m.p.cat].icono];
  const flote = menosMovimiento.matches ? 0 : Math.sin(t * 1.8 + m.p.x * 0.3) * 1.6;
  const s = activo ? 1.30 : 1;
  const x = m.sx, y = m.sy - 4 + flote;

  ctx.save();
  ctx.globalAlpha = alfa;

  // sombra en el suelo
  ctx.beginPath();
  ctx.ellipse(m.sx, m.sy, 7 * s, 3 * s, 0, 0, Math.PI * 2);
  ctx.fillStyle = "rgba(0,0,0,.16)";
  ctx.fill();

  // halo del seleccionado
  if (activo){
    const pulso = menosMovimiento.matches ? 1 : 1 + Math.sin(t * 3.4) * 0.14;
    ctx.beginPath();
    ctx.arc(x, y - 20 * s, 22 * s * pulso, 0, Math.PI * 2);
    ctx.fillStyle = tono;
    ctx.globalAlpha = alfa * 0.16;
    ctx.fill();
    ctx.globalAlpha = alfa;
  }

  // gota
  const r = 15 * s, cy = y - 20 * s;
  ctx.beginPath();
  ctx.moveTo(x, y);
  ctx.quadraticCurveTo(x - r * 0.75, y - r * 0.85, x - r * 0.72, cy);
  ctx.arc(x, cy, r * 0.72, Math.PI, 0);
  ctx.quadraticCurveTo(x + r * 0.75, y - r * 0.85, x, y);
  ctx.closePath();
  ctx.fillStyle = tono;
  ctx.fill();
  ctx.lineWidth = 2.4;
  ctx.strokeStyle = paleta.noche ? "rgba(255,255,255,.34)" : "rgba(255,255,255,.92)";
  ctx.stroke();

  // glifo
  ctx.save();
  ctx.translate(x, cy);
  ctx.strokeStyle = "#FFFFFF";
  ctx.lineWidth = 1.6;
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  glifo(ctx, 15 * s);
  ctx.restore();

  // contador de los puntos que quedaron debajo de este pin
  if (mas > 0){
    const bx = x + r * 0.62, by = cy - r * 0.62;
    ctx.beginPath();
    ctx.arc(bx, by, 9.5, 0, Math.PI * 2);
    ctx.fillStyle = paleta.panel;
    ctx.fill();
    ctx.lineWidth = 1.8;
    ctx.strokeStyle = tono;
    ctx.stroke();
    ctx.font = "700 10px Poppins, system-ui, sans-serif";
    ctx.fillStyle = tono;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("+" + mas, bx, by + 0.5);
  }

  // etiqueta del seleccionado
  if (activo){
    const texto = m.p.nombre;
    ctx.font = "700 13px Poppins, system-ui, sans-serif";
    const an = ctx.measureText(texto).width + 22;
    const ey = cy - r - 20;
    ctx.beginPath();
    if (ctx.roundRect){
      ctx.roundRect(x - an / 2, ey - 13, an, 26, 13);
    } else {
      const ax = x - an / 2, ay = ey - 13, ah = 26, rr = 13;
      ctx.moveTo(ax + rr, ay);
      ctx.arcTo(ax + an, ay, ax + an, ay + ah, rr);
      ctx.arcTo(ax + an, ay + ah, ax, ay + ah, rr);
      ctx.arcTo(ax, ay + ah, ax, ay, rr);
      ctx.arcTo(ax, ay, ax + an, ay, rr);
      ctx.closePath();
    }
    ctx.fillStyle = paleta.panel;
    ctx.fill();
    ctx.lineWidth = 1.4;
    ctx.strokeStyle = tono;
    ctx.stroke();
    ctx.fillStyle = paleta.tinta;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(texto, x, ey + 1);
  }
  ctx.restore();
}

/* ═══════════════════════════════════════════════════════════════
   6 · BUCLE DE DIBUJO
   ═══════════════════════════════════════════════════════════════ */

let cuadroPedido = false;
let t0 = performance.now();

/* ── Caché del mundo ────────────────────────────────────────────
   Pintar el parque entero cuesta unos 40 ms. Como no cambia salvo
   que se mueva la cámara o el tema, se pinta una vez en un lienzo
   aparte —con un margen alrededor para poder arrastrar sin
   repintar— y después cada cuadro sólo lo estampa. Encima van el
   oleaje y los pines, que sí son baratos.
   ─────────────────────────────────────────────────────────────── */
const cache = { c:null, an:0, al:0, dpr:0, camX:0, camY:0, esc:0, valido:false };

/* Margen de arrastre libre. En pantallas grandes se recorta para no
   reservar un lienzo enorme en memoria. */
function margen(){ return anchoCSS >= 820 ? 0.10 : 0.20; }

function invalidarCache(){ cache.valido = false; }

function renderCache(){
  const MARGEN = margen();
  const an = Math.ceil(anchoCSS * (1 + MARGEN * 2));
  const al = Math.ceil(altoCSS  * (1 + MARGEN * 2));
  if (!cache.c) cache.c = document.createElement("canvas");
  if (cache.an !== an || cache.al !== al || cache.dpr !== dpr){
    cache.c.width  = Math.round(an * dpr);
    cache.c.height = Math.round(al * dpr);
    cache.an = an; cache.al = al; cache.dpr = dpr;
  }
  const desX = anchoCSS * MARGEN, desY = altoCSS * MARGEN;
  const antes = ctx;
  ctx = cache.c.getContext("2d");
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, cache.c.width, cache.c.height);
  ctx.setTransform(dpr * cam.esc, 0, 0, dpr * cam.esc,
                   dpr * (cam.x + desX), dpr * (cam.y + desY));
  ctx.lineJoin = "round";
  ctx.imageSmoothingQuality = "high";
  dibujarSuelo();
  for (const o of objetos) o.dibujar();
  if (paleta.noche) caerLaNoche();
  ctx = antes;

  cache.camX = cam.x; cache.camY = cam.y; cache.esc = cam.esc;
  cache.valido = true;
}

/* ¿Se puede reutilizar la caché tal cual, o hay que repintarla? */
function cacheSirve(){
  if (!cache.valido) return false;
  if (Math.abs(cam.esc / cache.esc - 1) > 0.0015) return false;
  return !fueraDelMargen();
}
function fueraDelMargen(){
  return Math.abs(cam.x - cache.camX) > anchoCSS * margen()
      || Math.abs(cam.y - cache.camY) > altoCSS  * margen();
}
function enGesto(){ return !!(vuelo || pellizco || arrastre); }

function pedirCuadro(){
  if (cuadroPedido) return;
  cuadroPedido = true;
  requestAnimationFrame(pintar);
}

function pintar(ahora){
  cuadroPedido = false;
  avanzarVuelo(ahora);
  const t = (ahora - t0) / 1000;

  /* Durante un gesto se estira la caché anterior en vez de
     repintarla: se pierde algo de nitidez mientras dura el
     movimiento y se gana que no dé tirones. */
  if (!cacheSirve() && (!enGesto() || !cache.valido || fueraDelMargen())) renderCache();

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, anchoCSS, altoCSS);

  const k = cam.esc / cache.esc;
  const desX = anchoCSS * margen(), desY = altoCSS * margen();
  ctx.imageSmoothingQuality = "high";
  ctx.drawImage(
    cache.c,
    k * (-desX - cache.camX) + cam.x,
    k * (-desY - cache.camY) + cam.y,
    cache.an * k, cache.al * k
  );

  ctx.save();
  ctx.setTransform(dpr * cam.esc, 0, 0, dpr * cam.esc, dpr * cam.x, dpr * cam.y);
  ctx.lineJoin = "round";
  dibujarOleaje(t);
  ctx.restore();

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  dibujarMarcadores(t);

  if (vuelo || !menosMovimiento.matches) pedirCuadro();
}

let dpr = 1;
function redimensionar(){
  const r = lienzo.getBoundingClientRect();
  anchoCSS = r.width; altoCSS = r.height;
  dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  lienzo.width  = Math.round(anchoCSS * dpr);
  lienzo.height = Math.round(altoCSS * dpr);
  cam.escMin = encajar() * 0.75;
  cam.escMax = encajar() * 7;
  invalidarCache();
  pedirCuadro();
}

/* ═══════════════════════════════════════════════════════════════
   7 · INTERACCIÓN
   ═══════════════════════════════════════════════════════════════ */

const punteros = new Map();
let arrastre = null, pellizco = null, movido = 0;

lienzo.addEventListener("pointerdown", e => {
  lienzo.setPointerCapture(e.pointerId);
  punteros.set(e.pointerId, { x:e.clientX, y:e.clientY });
  movido = 0;
  if (punteros.size === 1){
    arrastre = { x:e.clientX, y:e.clientY, camX:cam.x, camY:cam.y };
    lienzo.classList.add("arrastrando");
    vuelo = null;
  } else if (punteros.size === 2){
    arrastre = null;
    pellizco = { dist: distPunteros(), esc: cam.esc, centro: centroPunteros() };
  }
});

lienzo.addEventListener("pointermove", e => {
  if (!punteros.has(e.pointerId)) return;
  punteros.set(e.pointerId, { x:e.clientX, y:e.clientY });

  if (pellizco && punteros.size >= 2){
    const d = distPunteros();
    const c = centroPunteros();
    const nueva = Math.max(cam.escMin, Math.min(cam.escMax, pellizco.esc * (d / pellizco.dist)));
    const k = nueva / cam.esc;
    cam.x = c.x - (pellizco.centro.x - cam.x) * k - (pellizco.centro.x - c.x);
    cam.y = c.y - (pellizco.centro.y - cam.y) * k - (pellizco.centro.y - c.y);
    cam.esc = nueva;
    pellizco.centro = c;
    pellizco.dist = d;
    pellizco.esc = nueva;
    movido += 10;
    pedirCuadro();
    return;
  }
  if (arrastre){
    const dx = e.clientX - arrastre.x, dy = e.clientY - arrastre.y;
    movido += Math.abs(dx) + Math.abs(dy);
    cam.x = arrastre.camX + dx;
    cam.y = arrastre.camY + dy;
    pedirCuadro();
  }
});

function finPuntero(e){
  if (!punteros.has(e.pointerId)) return;
  const era = punteros.size;
  punteros.delete(e.pointerId);
  if (punteros.size < 2) pellizco = null;
  if (punteros.size === 0){
    lienzo.classList.remove("arrastrando");
    if (era === 1 && movido < 9) tocar(e.clientX, e.clientY);
    arrastre = null;
  } else if (punteros.size === 1){
    const solo = [...punteros.values()][0];
    arrastre = { x:solo.x, y:solo.y, camX:cam.x, camY:cam.y };
  }
  // al soltar se repinta para recuperar la nitidez plena
  pedirCuadro();
}
lienzo.addEventListener("pointerup", finPuntero);
lienzo.addEventListener("pointercancel", finPuntero);

function distPunteros(){
  const [a, b] = [...punteros.values()];
  return Math.hypot(a.x - b.x, a.y - b.y) || 1;
}
function centroPunteros(){
  const [a, b] = [...punteros.values()];
  const r = lienzo.getBoundingClientRect();
  return { x:(a.x + b.x) / 2 - r.left, y:(a.y + b.y) / 2 - r.top };
}

lienzo.addEventListener("wheel", e => {
  e.preventDefault();
  const r = lienzo.getBoundingClientRect();
  zoomEn(e.deltaY < 0 ? 1.16 : 1 / 1.16, e.clientX - r.left, e.clientY - r.top);
}, { passive:false });

function tocar(clientX, clientY){
  const r = lienzo.getBoundingClientRect();
  const px = clientX - r.left, py = clientY - r.top;
  let mejor = null, mejorD = Infinity, mejorMas = 0;
  for (const [id, m] of pantalla){
    const d = Math.hypot(px - m.x, py - (m.y - 22));
    if (d < m.r && d < mejorD){ mejorD = d; mejor = id; mejorMas = m.mas; }
  }
  if (!mejor){ limpiarSeleccion(); return; }
  // Si el pin lleva contador, primero se acerca para que se separen
  if (mejorMas > 0 && cam.esc < cam.escMax * 0.9){
    const p = PUNTOS.find(q => q.id === mejor);
    irA(p.x, p.y, Math.min(cam.escMax, cam.esc * 2));
    return;
  }
  seleccionar(mejor);
}

/* ═══════════════════════════════════════════════════════════════
   8 · INTERFAZ
   ═══════════════════════════════════════════════════════════════ */

const hoja = document.getElementById("hoja");
const agarre = document.getElementById("agarre");
const cajaDetalle = document.getElementById("detalle");
const cajaDirectorio = document.getElementById("directorio");
const cajaFiltros = document.getElementById("filtros");

function altoHoja(){ return anchoCSS >= 820 ? 0 : 150; }

function svgGlifo(nombre, tam){
  // Reutiliza los glifos del canvas en un SVG para la interfaz
  const rutas = {
    ola:'<path d="M3 9c2-2 4 2 6 0s4-2 6 0 4 2 6 0"/><path d="M3 14c2-2 4 2 6 0s4-2 6 0 4 2 6 0"/>',
    tobogan:'<path d="M5 3v10"/><path d="M3 3h4"/><path d="M5 6c6 0 4 7 10 8"/><path d="M2 20c2-1.4 4 1 6 0s3-1.4 5 0 4 1 5 0"/>',
    comida:'<path d="M7 3v18M4 3v6h6V3"/><path d="M17 21v-8c-3 0-3-4 0-8 3 4 3 8 0 8"/>',
    info:'<circle cx="12" cy="7" r="1.2"/><path d="M10.6 11h1.7v8M9.6 19h5"/>',
    balon:'<circle cx="12" cy="12" r="9"/><path d="M3 12c3-2.6 15-2.6 18 0M12 3c-2.6 3-2.6 15 0 18"/>',
    casa:'<path d="M3 11 12 4l9 7"/><path d="M6 11v9h12v-9"/>'
  };
  return '<svg viewBox="0 0 24 24" width="'+tam+'" height="'+tam+'">'+rutas[nombre]+'</svg>';
}

/* ── Chips ─────────────────────────────────────────────────── */
function montarFiltros(){
  const opciones = [["todo","Todo el parque",null]].concat(
    Object.keys(CATEGORIAS).map(k => [k, CATEGORIAS[k].nombre, CATEGORIAS[k].tono])
  );
  cajaFiltros.innerHTML = opciones.map(([k, nombre, tono]) =>
    '<button class="chip" type="button" data-cat="'+k+'" aria-pressed="'+(k === "todo")+'"'+
    (tono ? ' style="--tono:'+tono+'"' : '')+'>'+
    (tono ? '<span class="punto"></span>' : '')+nombre+'</button>'
  ).join("");
  cajaFiltros.addEventListener("click", e => {
    const b = e.target.closest(".chip");
    if (!b) return;
    filtro = b.dataset.cat;
    for (const c of cajaFiltros.querySelectorAll(".chip")){
      c.setAttribute("aria-pressed", String(c === b));
    }
    if (seleccion){
      const p = PUNTOS.find(q => q.id === seleccion);
      if (p && !visible(p)) limpiarSeleccion();
    }
    montarDirectorio();
    pedirCuadro();
  });
}

/* ── Directorio ────────────────────────────────────────────── */
function montarDirectorio(){
  let html = seleccion
    ? ''
    : '<p class="pista"><b>Toca cualquier punto del mapa</b> para ver qué es. Arrastra para moverte y pellizca para acercar.</p>';
  for (const clave of Object.keys(CATEGORIAS)){
    if (filtro !== "todo" && filtro !== clave) continue;
    const lista = PUNTOS.filter(p => p.cat === clave);
    if (!lista.length) continue;
    const cat = CATEGORIAS[clave];
    html += '<h2 class="grupo-titulo">'+cat.nombre+'</h2><ul class="lista">';
    for (const p of lista){
      html += '<li><button class="item" type="button" data-id="'+p.id+'" style="--tono:'+cat.tono+'"'+
        (seleccion === p.id ? ' aria-current="true"' : '')+'>'+
        '<span class="item-punto">'+svgGlifo(cat.icono, 15)+'</span>'+p.nombre+'</button></li>';
    }
    html += '</ul>';
  }
  cajaDirectorio.innerHTML = html;
}
cajaDirectorio.addEventListener("click", e => {
  const b = e.target.closest(".item");
  if (b) seleccionar(b.dataset.id);
});

/* ── Detalle ───────────────────────────────────────────────── */
function seleccionar(id){
  const p = PUNTOS.find(q => q.id === id);
  if (!p) return;
  seleccion = id;
  const cat = CATEGORIAS[p.cat];
  cajaDetalle.hidden = false;
  cajaDetalle.innerHTML =
    '<div class="detalle-cabecera" style="--tono:'+cat.tono+'">'+
      '<span class="detalle-sello">'+svgGlifo(cat.icono, 24)+'</span>'+
      '<div class="detalle-textos">'+
        '<span class="detalle-cat">'+cat.nombre+'</span>'+
        '<h2 class="detalle-nombre">'+p.nombre+'</h2>'+
      '</div>'+
      '<button class="cerrar" type="button" id="btn-cerrar" aria-label="Volver al directorio">'+
        '<svg viewBox="0 0 24 24"><path d="M5 5l14 14M19 5 5 19"/></svg>'+
      '</button>'+
    '</div>'+
    '<p class="detalle-desc">'+p.desc+'</p>'+
    '<div class="datos">'+p.datos.map(d => '<span class="dato">'+d+'</span>').join("")+'</div>';
  document.getElementById("btn-cerrar").addEventListener("click", limpiarSeleccion);
  montarDirectorio();
  cajaDetalle.scrollIntoView({ block:"nearest" });
  abrirHoja(false);
  irA(p.x, p.y);
  pedirCuadro();
}

function limpiarSeleccion(){
  seleccion = null;
  cajaDetalle.hidden = true;
  cajaDetalle.innerHTML = "";
  montarDirectorio();
  pedirCuadro();
}

function abrirHoja(abierta){
  hoja.classList.toggle("abierta", abierta);
  agarre.setAttribute("aria-expanded", String(abierta));
  agarre.setAttribute("aria-label", abierta ? "Cerrar el directorio" : "Abrir el directorio");
}
agarre.addEventListener("click", () => abrirHoja(!hoja.classList.contains("abierta")));

document.getElementById("btn-mas").addEventListener("click",
  () => zoomEn(1.32, centroPantallaX(), centroPantallaY()));
document.getElementById("btn-menos").addEventListener("click",
  () => zoomEn(1 / 1.32, centroPantallaX(), centroPantallaY()));
document.getElementById("btn-vista").addEventListener("click", () => {
  limpiarSeleccion();
  abrirHoja(false);
  vistaCompleta(true);
});
window.addEventListener("keydown", e => {
  if (e.key === "Escape" && seleccion) limpiarSeleccion();
});

/* ── Cambios de tema: se repinta el parque con la otra luz ──── */
function alCambiarTema(){
  leerPaleta();
  construirEscena();
  invalidarCache();
  pedirCuadro();
}
matchMedia("(prefers-color-scheme:dark)").addEventListener("change", alCambiarTema);
new MutationObserver(alCambiarTema).observe(document.documentElement, {
  attributes:true, attributeFilter:["data-theme"]
});
menosMovimiento.addEventListener("change", pedirCuadro);

/* ═══════════════════════════════════════════════════════════════
   9 · ARRANQUE
   ═══════════════════════════════════════════════════════════════ */

function arrancar(){
  leerPaleta();
  construirEscena();
  montarFiltros();
  montarDirectorio();
  redimensionar();
  vistaInicial();
  pedirCuadro();
}

new ResizeObserver(() => {
  const antes = { x:cam.x, y:cam.y, esc:cam.esc };
  redimensionar();
  if (!antes.esc) vistaCompleta(false);
}).observe(lienzo);

if (document.fonts && document.fonts.ready){
  document.fonts.ready.then(pedirCuadro);
}
arrancar();
</script>
